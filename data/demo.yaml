# Demo apartment. Seed only: `PANEL_PASSWORD=... npm run seed` encrypts it into public/panel.enc.json.
# Real data should live only in the encrypted file and be edited in the app (#/edit).
format: panel-bundle
version: 1
assetsDir: assets
data:
  meta:
    title:
      ru: Квартира, щит ЩК-1
      en: Apartment, panel DB-1
      sr: Stan, razvodna tabla RT-1
      es: Apartamento, cuadro CG-1
    updated: "2026-10-01"
    enclosure: "Встраиваемый щит 4×18 модулей"
    location:
      ru: Прихожая, справа от входной двери, за зеркалом
      en: Hallway, right of the entrance door, behind the mirror
      sr: Hodnik, desno od ulaznih vrata, iza ogledala
      es: Recibidor, a la derecha de la puerta, detrás del espejo
    contacts:
      - role: electrician
        name: Иван (электромонтаж)
        phone: "+7 900 000-00-00"
        note:
          ru: Делал проводку и собирал щит, гарантия до 10.2028
          en: Did the wiring and assembled the panel, warranty until 10.2028
      - role: management
        name: Диспетчерская УК
        phone: "+7 900 000-00-01"
      - role: emergency
        name: Единая служба спасения
        phone: "112"
  supply:
    phases: 1
    voltage: 230
    maxPowerKw: 10
    input: QF0
    account: "7712-004-581"

  rows:
    - id: r1
      modules: 18
      items: [QF0, KV1, FV1, QF14, XS1, { blank: 8 }]
    - id: r2
      modules: 18
      items: [QD1, QF1, QF2, QF3, QF4, QFD1, QD2, QF5, QF6, QF7, QF8, { blank: 4 }]
    - id: r3
      modules: 18
      items: [QD3, QF9, QF10, QF11, QF12, QFD2, QFD3, QFD4, { blank: 2 }]
    - id: r4
      modules: 18
      items: [XN, { blank: 2 }, XPE, { blank: 8 }]

  devices:
    - id: QF0
      type: mcb
      label: { ru: Вводной автомат, en: Main breaker, sr: Glavni prekidač, es: Interruptor general }
      rating: 40
      curve: C
      poles: 2
      brand: ABB
      model: S202 C40
      upstream: PM1
      circuit: { cable: ВВГнг(А)-LS 3×10, crossSection: 10, lengthM: 18 }
      tags: [ввод]
      notes:
        - author: Иван
          date: "2026-09-12"
          text: Отключает всю квартиру. Автомат перед счётчиком стоит в этажном щите, его опломбировала УК.
    - id: QF00
      type: mcb
      label: { ru: Автомат квартиры в этажном щите, en: Flat breaker in the floor box, sr: Osigurač stana u spratnoj tabli, es: Interruptor de la vivienda en el cuarto de contadores }
      rating: 50
      curve: C
      poles: 2
      tags: [ввод]
      location:
        ru: "Этажный щит на площадке 5 этажа, слева от лифта. Ряд с подписью «кв. 42», автомат под счётчиком. Щит открывается ключом-треугольником, запасной у консьержа."
        en: "Floor box on the 5th floor landing, left of the lift. Row labelled “flat 42”, breaker below the meter. Opens with a triangle key; the concierge has a spare."
    - id: PM1
      type: meter
      label: { ru: Счётчик электроэнергии, en: Energy meter, sr: Brojilo električne energije, es: Contador de energía }
      poles: 2
      brand: Энергомера
      model: CE208 S7
      serial: "011234567890123"
      upstream: QF00
      tags: [ввод]
      location:
        ru: "В том же этажном щите, над автоматом квартиры. Показания передавать до 25 числа."
        en: "In the same floor box, above the flat breaker. Submit readings before the 25th."
    - id: KV1
      type: voltage-relay
      label: { ru: Реле напряжения, en: Voltage relay, sr: Naponski relej, es: Relé de tensión }
      rating: 63
      poles: 2
      brand: Новатек
      model: УЗМ-51М
      upstream: QF0
      tags: [ввод, защита]
      notes:
        - author: Иван
          date: "2026-09-12"
          text: "Уставки от 170 до 260 В, задержка включения 30 с. Если всё погасло и через минуту включилось само, сработало реле: авария в сети."
