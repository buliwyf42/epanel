  maintenance:
    tasks:
      - id: rcd-test
        title: { ru: Нажать кнопку «Тест» на УЗО и дифавтоматах, en: Press the TEST button on all RCDs and RCBOs, sr: Pritisnuti TEST na svim FID sklopkama, es: Pulsar TEST en todos los diferenciales }
        intervalDays: 30
        devices: [QD1, QD2, QD3, QFD1, QFD2, QFD3, QFD4]
        howTo: { ru: "Нажмите «Т». Устройство должно отключиться. Включите обратно. Если не отключилось, устройство неисправно: звоните электрику.", en: "Press T. The device must trip. Switch it back on. If it does not trip, it is faulty: call an electrician." }
      - id: spd-check
        title: { ru: Проверить индикатор УЗИП, en: Check the surge protector indicator, sr: Proveriti indikator prenaponske zaštite, es: Revisar el indicador del protector }
        intervalDays: 180
        devices: [FV1]
        howTo: { ru: "Окошко должно быть зелёным. Красное значит, что картридж отработал и его нужно заменить.", en: The window must be green. Red means the cartridge is spent and must be replaced. }
      - id: tighten
        title: { ru: Протяжка клемм и осмотр щита, en: Re-torque terminals and inspect the panel, sr: Pritezanje klema i pregled table, es: Reapriete de bornes e inspección }
        intervalDays: 365
        howTo: { ru: "Только электрик и только при снятом напряжении. Первая протяжка через месяц после сборки.", en: "Electrician only, with the power off. First re-torque one month after assembly." }
    log:
      - { task: rcd-test, date: "2026-08-20", author: Иван, note: Все УЗО сработали }
      - { task: spd-check, date: "2026-09-12", author: Иван }
      - { task: tighten, date: "2026-09-12", author: Иван, note: Первичная протяжка после сборки }

